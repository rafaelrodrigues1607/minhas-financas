name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html sw.js manifest.json www/
          cp -r icons www/

      - name: Add Android platform
        run: npx cap add android

      - name: Setup Firebase (google-services.json)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cp android-config/google-services.json android/app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Set app icons
        run: |
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            convert icons/icon.png -resize "${size}x${size}" "${dir}/ic_launcher.png"
            convert icons/icon.png -resize "${size}x${size}" -gravity center -background "#3ecf8e" -extent "${size}x${size}" "${dir}/ic_launcher_round.png"
          done

      - name: Sync web assets
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
